name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

  workflow_dispatch:

# Read-only unless a job asks for more: build and test run code from every installed package, so they get a token that
# can't push or approve pull requests, whatever the repository's default is
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read

    outputs:
      lambdas: ${{ steps.changes.outputs.lambdas }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed folders
        id: changes
        env:
          # A new push to a PR compares with the previous push, not the base branch, so a version or lockfile bump
          # doesn't recheck the folders the PR's earlier pushes already checked
          BASE:
            ${{ (github.event_name == 'push' || github.event.action == 'synchronize') && github.event.before ||
            github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Every Lambda folder, new ones are picked up automatically. lambda/shared is code the Lambdas bundle, not a
          # Lambda
          folders=$(ls -d lambda/*/ | sed 's:/$::' | grep -vx lambda/shared)

          # The previous push is only a safe base if CI passed on it; otherwise a folder that failed there and isn't
          # touched again would be skipped and turn the required check green. Fall back to the PR's base (everything the
          # PR changes), or to everything on a push to main
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE" ] && [ "$BASE" != "$PR_BASE" ] \
            && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            ci=$(gh api "repos/$REPO/commits/$BASE/check-runs?filter=latest&per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI") | .conclusion // .status] | join(" ")' 2>/dev/null) || ci=
            if [ "$ci" = success ]; then
              echo "CI passed on $BASE, checking the folders changed since then."
            else
              fallback="checking everything"
              [ -z "$PR_BASE" ] || fallback="comparing with the PR base $PR_BASE"
              echo "CI didn't pass on $BASE (${ci:-no result}), $fallback."
              BASE=$PR_BASE
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] \
            || ! changed=$(git diff --name-only "$BASE" "$HEAD") \
            || grep -q '^\.github/' <<< "$changed"; then
            # Manual run, unknown base (new branch, force push, previous push without passing CI on main) or a workflow
            # or action change: check everything
            selected=$folders
          else
            selected=$(grep -Fxf <(cut -d/ -f1-2 <<< "$changed" | sort -u) <<< "$folders" || true)
            # Every Lambda bundles lambda/shared, extends lambda/tsconfig.lambda.json and installs from the root
            # workspace (package.json, package-lock.json): a change there checks them all
            if grep -qE '^(lambda/(shared/|tsconfig\.lambda\.json$)|package(-lock)?\.json$)' <<< "$changed"; then
              selected=$(printf '%s\n%s\n' "$selected" "$(grep '^lambda/' <<< "$folders")" | sed '/^$/d' | sort -u)
            fi
          fi

          to_json() { { grep "^$1/" <<< "$selected" || true; } | cut -d/ -f2 | jq -Rnc '[inputs]'; }
          # Assigned first so a failure fails the step, instead of passing an empty output
          lambdas=$(to_json lambda)
          echo "lambdas=$lambdas" >> "$GITHUB_OUTPUT"

  # Checks that look at the whole workspace, so they run on every push, whatever it changes
  root:
    name: Global checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install
        uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository]

      - name: Prettier
        run: npm run prettier:ci

      # Unused files, exports and dependencies, across the Lambdas and lambda/shared (knip.jsonc)
      - name: knip
        run: npm run knip

      # Copy-pasted code in lambda/ (.jscpd.json): fails when more than 1% of the lines are duplicated, the specs left
      # out. Code two Lambdas share belongs in lambda/shared
      - name: jscpd
        run: npm run jscpd

  # Local links and #anchors in every Markdown file, on every push (doc-only ones too). --offline skips external URLs,
  # --hidden includes .claude/; .gitignored files (node_modules, dist) are skipped
  links:
    name: Link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --hidden --no-progress './**/*.md'
          fail: true
          jobSummary: false

  lambda:
    name: Lambda CI
    needs: changes
    if: needs.changes.outputs.lambdas != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lambda_function: ${{ fromJSON(needs.changes.outputs.lambdas) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The repo is one npm workspace, installed (and cached) once at the root
      - name: Install
        uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository]

      - name: oxlint
        run: npm run lint
        working-directory: lambda/${{ matrix.lambda_function }}

      # esbuild strips types without checking them; this also checks the lambda/shared code the Lambda imports
      - name: Type check
        run: npx tsc --noEmit -p .
        working-directory: lambda/${{ matrix.lambda_function }}

      - name: Build
        run: npm run build
        working-directory: lambda/${{ matrix.lambda_function }}

      - name: Test (Vitest)
        if: hashFiles(format('lambda/{0}/vitest.config.*', matrix.lambda_function)) != ''
        run: npx vitest run
        working-directory: lambda/${{ matrix.lambda_function }}

  # CI's required check (zizmor.yml's zizmor is the other): skipped jobs pass, failed or cancelled ones (including
  # change detection) don't
  ci:
    name: CI
    if: always()
    needs: [changes, root, links, lambda]
    runs-on: ubuntu-latest

    steps:
      - name: All checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
