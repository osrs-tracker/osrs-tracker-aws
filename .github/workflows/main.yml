name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read

    outputs:
      packages: ${{ steps.changes.outputs.packages }}
      lambdas: ${{ steps.changes.outputs.lambdas }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed folders
        id: changes
        env:
          # A new push to a PR compares with the previous push, not the base branch, so a version or lockfile bump
          # doesn't recheck the folders the PR's earlier pushes already checked
          BASE:
            ${{ (github.event_name == 'push' || github.event.action == 'synchronize') && github.event.before ||
            github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Every package and lambda folder, new ones are picked up automatically. lambda/shared is code the Lambdas
          # bundle, not a Lambda
          folders=$(ls -d @osrs-tracker/*/ lambda/*/ | sed 's:/$::' | grep -vx lambda/shared)

          # The previous push is only a safe base if CI passed on it; otherwise a folder that failed there and isn't
          # touched again would be skipped and turn the required check green. Fall back to the PR's base (everything the
          # PR changes), or to everything on a push to main
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE" ] && [ "$BASE" != "$PR_BASE" ] \
            && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            ci=$(gh api "repos/$REPO/commits/$BASE/check-runs?filter=latest&per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI") | .conclusion // .status] | join(" ")' 2>/dev/null) || ci=
            if [ "$ci" = success ]; then
              echo "CI passed on $BASE, checking the folders changed since then."
            else
              fallback="checking everything"
              [ -z "$PR_BASE" ] || fallback="comparing with the PR base $PR_BASE"
              echo "CI didn't pass on $BASE (${ci:-no result}), $fallback."
              BASE=$PR_BASE
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] \
            || ! changed=$(git diff --name-only "$BASE" "$HEAD") \
            || grep -q '^\.github/' <<< "$changed"; then
            # Manual run, unknown base (new branch, force push, previous push without passing CI on main) or a workflow
            # or action change: check everything
            selected=$folders
          else
            selected=$(grep -Fxf <(cut -d/ -f1-2 <<< "$changed" | sort -u) <<< "$folders" || true)
            # Every Lambda bundles lambda/shared and extends lambda/tsconfig.lambda.json: a change there checks them all
            if grep -qE '^lambda/(shared/|tsconfig\.lambda\.json$)' <<< "$changed"; then
              selected=$(printf '%s\n%s\n' "$selected" "$(grep '^lambda/' <<< "$folders")" | sed '/^$/d' | sort -u)
            fi
          fi

          to_json() { { grep "^$1/" <<< "$selected" || true; } | cut -d/ -f2 | jq -Rnc '[inputs]'; }
          # Assigned first so a failure fails the step, instead of passing an empty output
          packages=$(to_json @osrs-tracker)
          lambdas=$(to_json lambda)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "lambdas=$lambdas" >> "$GITHUB_OUTPUT"

  root:
    name: Global Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/setup-deps

      - name: Prettier
        run: npm run prettier:ci

  packages:
    name: Package CI
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/setup-deps
        with:
          working-directory: '@osrs-tracker/${{ matrix.package }}'

      - name: Test (Jest)
        if: matrix.package == 'hiscores'
        run: npx jest --ci
        working-directory: '@osrs-tracker/${{ matrix.package }}'

      - name: Test (Vitest)
        if: hashFiles(format('@osrs-tracker/{0}/vitest.config.ts', matrix.package)) != ''
        run: npx vitest run
        working-directory: '@osrs-tracker/${{ matrix.package }}'

      - name: Build
        run: npm run build
        working-directory: '@osrs-tracker/${{ matrix.package }}'

      # Loads the build with require and import, also by package name from the packed tarball
      - name: Build loads with require and import
        run: ../../.github/scripts/check-package-loads.sh
        working-directory: '@osrs-tracker/${{ matrix.package }}'

  lambda:
    name: Lambda CI
    needs: changes
    if: needs.changes.outputs.lambdas != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lambda_function: ${{ fromJSON(needs.changes.outputs.lambdas) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/setup-deps
        with:
          working-directory: lambda/${{ matrix.lambda_function }}

      - name: ESlint
        run: npm run lint
        working-directory: lambda/${{ matrix.lambda_function }}

      - name: Prettier
        run: npm run prettier:ci
        working-directory: lambda/${{ matrix.lambda_function }}

      # esbuild strips types without checking them; this also checks the lambda/shared code the Lambda imports
      - name: Type check
        run: npx tsc --noEmit -p .
        working-directory: lambda/${{ matrix.lambda_function }}

      - name: Build
        run: npm run build
        working-directory: lambda/${{ matrix.lambda_function }}

  # The only required check: skipped jobs pass, failed or cancelled ones (including change detection) don't
  ci:
    name: CI
    if: always()
    needs: [changes, root, packages, lambda]
    runs-on: ubuntu-latest

    steps:
      - name: All checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
