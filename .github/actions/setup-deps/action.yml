name: Set up Node and dependencies
description:
  Installs Node and restores the repo's node_modules from the cache, running npm ci only when package-lock.json (or the
  Node major) changed. The cache is saved right after npm ci, so it never contains what later steps write into
  node_modules.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24.x'
    - id: cache
      uses: actions/cache/restore@v6
      with:
        # The repo is one npm workspace; a Lambda gets its own node_modules only for a version the hoisted one doesn't
        # satisfy
        path: |
          node_modules
          lambda/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
    # Parallel jobs that all missed race to save the same key; the losers only log a warning
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          lambda/*/node_modules
        key: ${{ steps.cache.outputs.cache-primary-key }}
